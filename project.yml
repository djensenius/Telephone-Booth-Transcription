name: TelephoneBoothTranscription
options:
  bundleIdPrefix: org.davidjensenius
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  hummingbird:
    url: https://github.com/hummingbird-project/hummingbird.git
    from: 2.5.0
  async-http-client:
    url: https://github.com/swift-server/async-http-client.git
    from: 1.21.0
  swift-nio:
    url: https://github.com/apple/swift-nio.git
    from: 2.65.0
  swift-log:
    url: https://github.com/apple/swift-log.git
    from: 1.5.0
  swift-crypto:
    url: https://github.com/apple/swift-crypto.git
    from: 3.0.0
  swift-service-context:
    url: https://github.com/apple/swift-service-context.git
    from: 1.3.0
  swift-nio-transport-services:
    url: https://github.com/apple/swift-nio-transport-services.git
    from: 1.28.0
  grdb-swift:
    url: https://github.com/groue/GRDB.swift.git
    from: 6.29.0
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_VERSION: "6.0"
targets:
  TranscriptionShared:
    type: framework
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/TranscriptionShared
    info:
      path: Resources/TranscriptionShared-Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: TranscriptionShared
        CFBundlePackageType: FMWK
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.davidjensenius.TelephoneBoothTranscription.shared
        OTHER_SWIFT_FLAGS: "$(inherited) -enable-upcoming-feature ExistentialAny -enable-experimental-feature StrictConcurrency"

  TranscriptionOnDevice:
    type: framework
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/TranscriptionOnDevice
    info:
      path: Resources/TranscriptionOnDevice-Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: TranscriptionOnDevice
        CFBundlePackageType: FMWK
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
    dependencies:
      - target: TranscriptionShared
      - package: swift-log
        product: Logging
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.davidjensenius.TelephoneBoothTranscription.ondevice
        OTHER_SWIFT_FLAGS: "$(inherited) -enable-upcoming-feature ExistentialAny -enable-experimental-feature StrictConcurrency"

  TranscriptionOperator:
    type: framework
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/TranscriptionOperator
    info:
      path: Resources/TranscriptionOperator-Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: TranscriptionOperator
        CFBundlePackageType: FMWK
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
    dependencies:
      - target: TranscriptionShared
      - package: async-http-client
        product: AsyncHTTPClient
      - package: swift-nio
        product: NIOCore
      - package: swift-nio
        product: NIOHTTP1
      - package: swift-log
        product: Logging
      - package: swift-crypto
        product: Crypto
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.davidjensenius.TelephoneBoothTranscription.operator
        OTHER_SWIFT_FLAGS: "$(inherited) -enable-upcoming-feature ExistentialAny -enable-experimental-feature StrictConcurrency"

  TranscriptionCore:
    type: framework
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/TranscriptionCore
    info:
      path: Resources/TranscriptionCore-Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: TranscriptionCore
        CFBundlePackageType: FMWK
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
    dependencies:
      - target: TranscriptionShared
      - target: TranscriptionOnDevice
      - target: TranscriptionOperator
      - package: hummingbird
        product: Hummingbird
      - package: swift-service-context
        product: ServiceContextModule
      - package: async-http-client
        product: AsyncHTTPClient
      - package: swift-log
        product: Logging
      - package: swift-crypto
        product: Crypto
      - package: grdb-swift
        product: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.davidjensenius.TelephoneBoothTranscription.core
        OTHER_SWIFT_FLAGS: "$(inherited) -enable-upcoming-feature ExistentialAny -enable-experimental-feature StrictConcurrency"

  TranscriptionAuth:
    type: framework
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/TranscriptionAuth
    info:
      path: Resources/TranscriptionAuth-Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: TranscriptionAuth
        CFBundlePackageType: FMWK
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.davidjensenius.TelephoneBoothTranscription.auth
        OTHER_SWIFT_FLAGS: "$(inherited) -enable-upcoming-feature ExistentialAny -enable-experimental-feature StrictConcurrency"

  TranscriptionReview:
    type: framework
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/TranscriptionReview
    info:
      path: Resources/TranscriptionReview-Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: TranscriptionReview
        CFBundlePackageType: FMWK
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.davidjensenius.TelephoneBoothTranscription.review
        OTHER_SWIFT_FLAGS: "$(inherited) -enable-upcoming-feature ExistentialAny -enable-experimental-feature StrictConcurrency"

  TranscriptionApp:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    # productName must match PRODUCT_NAME so the product reference filename is
    # "Transcriber.app". Otherwise xcodegen names the product
    # reference after the target ("TranscriptionApp.app") and Xcode rewrites the
    # shared scheme on every open to match the real product name.
    productName: "Transcriber"
    sources:
      - path: Sources/TranscriptionApp
      - path: Resources/AppIcon.icon
        buildPhase: resources
      - path: Resources/Assets.xcassets
        buildPhase: resources
    dependencies:
      - target: TranscriptionCore
      - target: TranscriptionShared
      - target: TranscriptionOnDevice
      - target: TranscriptionOperator
      - target: TranscriptionAuth
      - target: TranscriptionReview
      - package: async-http-client
        product: AsyncHTTPClient
      - package: swift-nio-transport-services
        product: NIOTransportServices
      - package: swift-crypto
        product: Crypto
      - package: swift-log
        product: Logging
    info:
      path: Resources/TranscriptionApp-Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: "Transcriber"
        CFBundleDisplayName: "Transcriber"
        CFBundleIconName: AppIcon
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: "Copyright 2026 David Jensenius"
        NSMicrophoneUsageDescription: "Transcription Booth needs microphone access only if you point a client at the macOS Speech backend with a live audio source."
        NSSpeechRecognitionUsageDescription: "Transcription Booth uses on-device speech recognition to convert audio to text when the built-in macOS transcription backend is selected."
        OIDCIssuerBase: "https://auth.fluxhaus.io/application/o/telephone-booth-operator-mobile"
        OIDCClientID: "x0M0MleMvCSCx8MqIE2jVoYe57nAhGymIG8azTEY"
        OIDCRedirectScheme: "tbtranscription"
        OIDCScopes: "openid email profile offline_access"
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: org.davidjensenius.TelephoneBoothTranscription.oauth
            CFBundleURLSchemes:
              - tbtranscription
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.davidjensenius.TelephoneBoothTranscription
        PRODUCT_NAME: "Transcriber"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "9JALHNGRBQ"
        CODE_SIGN_ENTITLEMENTS: Resources/TranscriptionApp.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_ENABLE_CFBUNDLEICONS_MERGE: NO
        # Required for Mac App Store / TestFlight distribution. macOS rejects
        # uploads whose executable is not hardened; iOS has no equivalent.
        ENABLE_HARDENED_RUNTIME: YES
        OTHER_SWIFT_FLAGS: "$(inherited) -enable-upcoming-feature ExistentialAny"
    postBuildScripts:
      - name: "Prefer Icon Composer app icon"
        shell: /bin/bash
        basedOnDependencyAnalysis: false
        inputFiles:
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Assets.car"
        outputFiles:
          - "$(DERIVED_FILE_DIR)/PreferIconComposerAppIcon.stamp"
        script: |
          set -euo pipefail
          plist="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          if [[ -f "$plist" ]]; then
            /usr/libexec/PlistBuddy -c "Delete :CFBundleIconFile" "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Set :CFBundleIconName AppIcon" "$plist" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Add :CFBundleIconName string AppIcon" "$plist"
          fi
          touch "${DERIVED_FILE_DIR}/PreferIconComposerAppIcon.stamp"
  # ---------------------------------------------------------------------------
  # iOS variants. These share the same Sources/ as the macOS targets above but
  # build for iOS. PRODUCT_MODULE_NAME is pinned to the base module name so
  # `import TranscriptionCore` (etc.) keeps resolving from the shared sources.
  # ---------------------------------------------------------------------------
  TranscriptionShared_iOS:
    type: framework
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/TranscriptionShared
    info:
      path: Resources/TranscriptionShared-Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: TranscriptionShared
        CFBundlePackageType: FMWK
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.davidjensenius.TelephoneBoothTranscription.shared
        PRODUCT_NAME: TranscriptionShared
        PRODUCT_MODULE_NAME: TranscriptionShared
        OTHER_SWIFT_FLAGS: "$(inherited) -enable-upcoming-feature ExistentialAny -enable-experimental-feature StrictConcurrency"

  TranscriptionOnDevice_iOS:
    type: framework
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/TranscriptionOnDevice
    info:
      path: Resources/TranscriptionOnDevice-Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: TranscriptionOnDevice
        CFBundlePackageType: FMWK
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
    dependencies:
      - target: TranscriptionShared_iOS
      - package: swift-log
        product: Logging
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.davidjensenius.TelephoneBoothTranscription.ondevice
        PRODUCT_NAME: TranscriptionOnDevice
        PRODUCT_MODULE_NAME: TranscriptionOnDevice
        OTHER_SWIFT_FLAGS: "$(inherited) -enable-upcoming-feature ExistentialAny -enable-experimental-feature StrictConcurrency"

  TranscriptionOperator_iOS:
    type: framework
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/TranscriptionOperator
    info:
      path: Resources/TranscriptionOperator-Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: TranscriptionOperator
        CFBundlePackageType: FMWK
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
    dependencies:
      - target: TranscriptionShared_iOS
      - package: async-http-client
        product: AsyncHTTPClient
      - package: swift-nio
        product: NIOCore
      - package: swift-nio
        product: NIOHTTP1
      - package: swift-log
        product: Logging
      - package: swift-crypto
        product: Crypto
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.davidjensenius.TelephoneBoothTranscription.operator
        PRODUCT_NAME: TranscriptionOperator
        PRODUCT_MODULE_NAME: TranscriptionOperator
        OTHER_SWIFT_FLAGS: "$(inherited) -enable-upcoming-feature ExistentialAny -enable-experimental-feature StrictConcurrency"

  TranscriptionCore_iOS:
    type: framework
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/TranscriptionCore
    info:
      path: Resources/TranscriptionCore-Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: TranscriptionCore
        CFBundlePackageType: FMWK
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
    dependencies:
      - target: TranscriptionShared_iOS
      - target: TranscriptionOnDevice_iOS
      - target: TranscriptionOperator_iOS
      - package: hummingbird
        product: Hummingbird
      - package: swift-service-context
        product: ServiceContextModule
      - package: async-http-client
        product: AsyncHTTPClient
      - package: swift-log
        product: Logging
      - package: swift-crypto
        product: Crypto
      - package: grdb-swift
        product: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.davidjensenius.TelephoneBoothTranscription.core
        PRODUCT_NAME: TranscriptionCore
        PRODUCT_MODULE_NAME: TranscriptionCore
        OTHER_SWIFT_FLAGS: "$(inherited) -enable-upcoming-feature ExistentialAny -enable-experimental-feature StrictConcurrency"

  TranscriptionAuth_iOS:
    type: framework
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/TranscriptionAuth
    info:
      path: Resources/TranscriptionAuth-Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: TranscriptionAuth
        CFBundlePackageType: FMWK
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.davidjensenius.TelephoneBoothTranscription.auth
        PRODUCT_NAME: TranscriptionAuth
        PRODUCT_MODULE_NAME: TranscriptionAuth
        OTHER_SWIFT_FLAGS: "$(inherited) -enable-upcoming-feature ExistentialAny -enable-experimental-feature StrictConcurrency"

  TranscriptionReview_iOS:
    type: framework
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/TranscriptionReview
    info:
      path: Resources/TranscriptionReview-Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: TranscriptionReview
        CFBundlePackageType: FMWK
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.davidjensenius.TelephoneBoothTranscription.review
        PRODUCT_NAME: TranscriptionReview
        PRODUCT_MODULE_NAME: TranscriptionReview
        OTHER_SWIFT_FLAGS: "$(inherited) -enable-upcoming-feature ExistentialAny -enable-experimental-feature StrictConcurrency"

  TranscriptionAppiOS:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    # See TranscriptionApp above: keep productName in sync with PRODUCT_NAME so
    # the product reference filename matches and Xcode stops rewriting the scheme.
    productName: "Transcriber"
    sources:
      - path: Sources/TranscriptionApp
      - path: Resources/AppIcon.icon
        buildPhase: resources
      - path: Resources/Assets.xcassets
        buildPhase: resources
    dependencies:
      - target: TranscriptionAuth_iOS
      - target: TranscriptionReview_iOS
    info:
      path: Resources/TranscriptionAppiOS-Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: "Transcriber"
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: "Transcriber"
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        OIDCIssuerBase: "https://auth.fluxhaus.io/application/o/telephone-booth-operator-mobile"
        OIDCClientID: "x0M0MleMvCSCx8MqIE2jVoYe57nAhGymIG8azTEY"
        OIDCRedirectScheme: "tbtranscription"
        OIDCScopes: "openid email profile offline_access"
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: org.davidjensenius.TelephoneBoothTranscription.oauth
            CFBundleURLSchemes:
              - tbtranscription
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.davidjensenius.TelephoneBoothTranscription
        PRODUCT_NAME: "Transcriber"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "9JALHNGRBQ"
        OTHER_SWIFT_FLAGS: "$(inherited) -enable-upcoming-feature ExistentialAny"
schemes:
  TranscriptionApp:
    build:
      targets:
        TranscriptionApp: all
    run:
      config: Debug
    archive:
      config: Release
  TranscriptionAppiOS:
    build:
      targets:
        TranscriptionAppiOS: all
    run:
      config: Debug
    archive:
      config: Release
  TranscriptionCore:
    build:
      targets:
        TranscriptionCore: all
  TranscriptionShared:
    build:
      targets:
        TranscriptionShared: all
  TranscriptionOnDevice:
    build:
      targets:
        TranscriptionOnDevice: all
  TranscriptionOperator:
    build:
      targets:
        TranscriptionOperator: all
  TranscriptionAuth:
    build:
      targets:
        TranscriptionAuth: all
  TranscriptionReview:
    build:
      targets:
        TranscriptionReview: all
